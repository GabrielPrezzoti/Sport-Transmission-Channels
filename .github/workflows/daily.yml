name: Agenda esportiva diária

on:
  schedule:
    - cron: '0 12 * * *' # 09h de Brasília (UTC-3); pode haver atraso do GitHub.
  workflow_dispatch:
    inputs:
      send:
        description: Enviar ao Telegram (exige delivery.enabled = true)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sports-digest-delivery
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Data da agenda
        id: day
        run: echo "date=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restaurar registro de entrega
        id: state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: delivery-v1-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: delivery-v1-${{ steps.day.outputs.date }}-
      - name: Coletar e preparar agenda
        env:
          PYTHONUTF8: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOULD_SEND: ${{ github.event_name == 'schedule' || inputs.send }}
          DIGEST_DATE: ${{ steps.day.outputs.date }}
        shell: bash
        run: |
          if [ "$SHOULD_SEND" = "true" ]; then
            sports-digest --date "$DIGEST_DATE" --send
          else
            sports-digest --date "$DIGEST_DATE"
          fi
      - name: Preservar registro mesmo em caso de falha
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: delivery-v1-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Guardar prévia e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-${{ steps.day.outputs.date }}-${{ github.run_attempt }}
          path: |
            output/
            .state/
          include-hidden-files: true
          retention-days: 14
