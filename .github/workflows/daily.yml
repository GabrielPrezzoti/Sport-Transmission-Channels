name: Agenda esportiva diária

on:
  schedule:
    - cron: '0 3 * * *' # 00h de Brasília (UTC-3); antecedência para atrasos do GitHub.
    - cron: '17,37 3 * * *' # Recuperação às 00h17/00h37; registro impede reenvio confirmado.
  workflow_dispatch:
    inputs:
      send:
        description: Enviar ao Telegram, mesmo se já enviado hoje (exige delivery.enabled = true)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sports-digest-delivery
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Data da agenda
        id: day
        run: echo "date=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restaurar registro de entrega
        id: state
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: delivery-v1-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: delivery-v1-${{ steps.day.outputs.date }}-
      - name: Coletar e preparar agenda
        env:
          PYTHONUTF8: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOULD_SEND: ${{ github.event_name == 'schedule' || inputs.send }}
          FORCE_RESEND: ${{ github.event_name == 'workflow_dispatch' && inputs.send }}
          DIGEST_DATE: ${{ steps.day.outputs.date }}
        shell: bash
        run: |
          if [ "$FORCE_RESEND" = "true" ]; then
            sports-digest --date "$DIGEST_DATE" --send --force-resend
          elif [ "$SHOULD_SEND" = "true" ]; then
            sports-digest --date "$DIGEST_DATE" --send
          else
            sports-digest --date "$DIGEST_DATE"
          fi
      - name: Preservar registro mesmo em caso de falha
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .state
          key: delivery-v1-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Guardar prévia e evidências
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agenda-${{ steps.day.outputs.date }}-${{ github.run_attempt }}
          path: |
            output/
            .state/
          include-hidden-files: true
          retention-days: 14
      - name: Resumo do disparo e registro de entrega
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
          DIGEST_DATE: ${{ steps.day.outputs.date }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          counts = {"sent": 0, "pending": 0, "new": 0}
          for path in Path(".state").glob(os.environ["DIGEST_DATE"] + "-*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              for part in data.get("parts", []):
                  state = part.get("status")
                  if state in counts:
                      counts[state] += 1
          lines = [
              "## Agenda esportiva — diagnóstico",
              f"Evento: {os.environ['RUN_EVENT']}",
              f"Cron: {os.environ.get('RUN_SCHEDULE') or 'execução manual'}",
              f"Data da agenda (Brasília): {os.environ['DIGEST_DATE']}",
              f"Diagnóstico registrado em UTC: {datetime.now(timezone.utc).isoformat()}",
              f"Partes no registro do dia: {counts}",
              "O registro pode ter sido restaurado de uma execução anterior. Veja no log quantas partes foram enviadas nesta execução.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n\n".join(lines) + "\n")
          PY
